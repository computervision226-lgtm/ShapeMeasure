# Commit the CONTENTS of the ShapeMeasure folder at your repository root.
# Setup instructions: CODEMAGIC.md. Replace both example bundle IDs below.
workflows:
  shapemeasure-lidar-check:
    name: ShapeMeasure LiDAR build check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Check geometry and point cloud exporters
        script: |
          set -euo pipefail
          bash Scripts/verify.sh
      - name: Compile iPhone app without signing
        script: |
          set -euo pipefail
          bash Scripts/check_ios.sh 2>&1 | tee /tmp/shapemeasure-ios-build.log
    artifacts:
      - /tmp/shapemeasure-ios-build.log
      - .build-ios/Logs/Build/*.xcactivitylog
  shapemeasure-testflight:
    name: ShapeMeasure TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: shapemeasure-apple
    environment:
      xcode: "26.6"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.maged.shapemeasure
      vars:
        BUNDLE_ID: "com.maged.shapemeasure"
        BUILD_NUMBER_OFFSET: "0"
    scripts:
      - name: Check geometry and point cloud exporters
        script: |
          set -euo pipefail
          bash Scripts/verify.sh
      - name: Configure bundle identifier and build number
        script: |
          set -euo pipefail
          python3 Scripts/configure_ci.py \
            --bundle-id "$BUNDLE_ID" \
            --counter "$PROJECT_BUILD_NUMBER" \
            --offset "$BUILD_NUMBER_OFFSET"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Apply App Store signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles --project ShapeMeasure.xcodeproj
      - name: Build signed iPhone app
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project ShapeMeasure.xcodeproj \
            --scheme ShapeMeasure \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Upload the IPA. Assign the processed build to an internal group
        # in App Store Connect, following CODEMAGIC.md.
        submit_to_testflight: false
        submit_to_app_store: false
