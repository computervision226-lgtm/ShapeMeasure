# Commit the CONTENTS of the ShapeMeasure folder at your repository root.
# Setup instructions: CODEMAGIC.md. Replace both example bundle IDs below.
workflows:
  shapemeasure-testflight:
    name: ShapeMeasure TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: shapemeasure-apple
    environment:
      xcode: "26.6"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.maged.shapemeasure
      vars:
        BUNDLE_ID: "com.maged.shapemeasure"
        BUILD_NUMBER_OFFSET: "0"
    scripts:
      - name: Check geometry and shapefile exporter
        script: |
          set -euo pipefail
          bash Scripts/verify.sh
      - name: Configure bundle identifier and build number
        script: |
          set -euo pipefail
          python3 Scripts/configure_ci.py \
            --bundle-id "$BUNDLE_ID" \
            --counter "$PROJECT_BUILD_NUMBER" \
            --offset "$BUILD_NUMBER_OFFSET"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Apply App Store signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles --project ShapeMeasure.xcodeproj
      - name: Build signed iPhone app
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project ShapeMeasure.xcodeproj \
            --scheme ShapeMeasure \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Upload the IPA. Assign the processed build to an internal group
        # in App Store Connect, following CODEMAGIC.md.
        submit_to_testflight: false
        submit_to_app_store: false

  partscan-testflight:
    name: PartScan TestFlight (iPhone LiDAR scanner app)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: shapemeasure-apple
    environment:
      xcode: "26.6"
      groups:
        - partscan_signing   # holds the secret CERTIFICATE_PRIVATE_KEY (PARTSCAN.md, step 2)
      vars:
        # PartScan ships under the existing ShapeMeasure app record (same bundle ID, version 1.0.x).
        # Installing it from TestFlight replaces ShapeMeasure on the phone, and vice versa.
        BUNDLE_ID: "com.maged.shapemeasure"
        BUILD_NUMBER_OFFSET: "0"
    scripts:
      - name: Regenerate the Xcode project from PartScan/ and configure it
        script: |
          set -euo pipefail
          python3 Scripts/generate_partscan_project.py
          python3 Scripts/configure_ci.py \
            --project PartScan.xcodeproj \
            --bundle-id "$BUNDLE_ID" \
            --counter "$PROJECT_BUILD_NUMBER" \
            --offset "$BUILD_NUMBER_OFFSET"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Fetch or create the signing certificate and App Store profile
        script: |
          set -euo pipefail
          : "${CERTIFICATE_PRIVATE_KEY:?Add the secret variable CERTIFICATE_PRIVATE_KEY in group partscan_signing (see PARTSCAN.md, step 2)}"
          keychain initialize
          # Uses the App Store Connect key of the integration: finds (or creates) the Apple Distribution
          # certificate matching CERTIFICATE_PRIVATE_KEY and an App Store provisioning profile for BUNDLE_ID.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project PartScan.xcodeproj
      - name: Build signed PartScan app
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project PartScan.xcodeproj \
            --scheme PartScan \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Uploads the build to App Store Connect. Give your internal TestFlight group
        # "automatic distribution" (PARTSCAN.md) and every upload lands on the phone by itself.
        submit_to_testflight: false
        submit_to_app_store: false
